<!doctype html>
<!-- Source for public/og-image.png (1200×630 social share image).
     Re-render with: node branding/render-og-image.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Nunito'; font-weight: 300 900; src: url(../public/libs/fonts/nunito/XRXV3I6Li01BKofINeaB.woff2) format('woff2'); }
  :root { --ink: #24282d; --red: #E8443A; --muted: #5f6670; --line: #d9dde3;
          --blue: #268cff; --green: #4f9b63; --orange: #ef8b2c; --purple: #8b5cc7; --header: #52769a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body { font-family: 'Nunito', sans-serif; color: var(--ink); background: #fbfaf7; position: relative; overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--red); }
  .copy { position: absolute; left: 84px; top: 62px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 46px; font-weight: 800; letter-spacing: -0.5px; }
  .brand .map { color: var(--red); }
  h1 { margin-top: 40px; font-size: 58px; line-height: 1.04; font-weight: 900; letter-spacing: -1.5px; }
  p.sub { margin-top: 26px; font-size: 27px; line-height: 1.4; color: var(--muted); font-weight: 600; }
  .chips { margin-top: 30px; display: flex; gap: 12px; }
  .chip { padding: 8px 16px; border-radius: 999px; font-size: 21px; font-weight: 800; color: #fff; }
  .url { position: absolute; left: 84px; bottom: 38px; font-size: 22px; font-weight: 700; color: var(--muted); letter-spacing: 0.2px; }
  svg.graph { position: absolute; right: 0; top: 0; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="copy">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <g stroke="#24282d" stroke-width="2.4" stroke-linecap="round">
          <line x1="10" y1="38" x2="10" y2="13"/><line x1="10" y1="13" x2="24" y2="27"/>
          <line x1="24" y1="27" x2="38" y2="13"/><line x1="38" y1="13" x2="38" y2="38"/>
          <circle cx="10" cy="13" r="4.2" fill="#fbfaf7"/><circle cx="38" cy="13" r="4.2" fill="#fbfaf7"/>
          <circle cx="10" cy="38" r="4.2" fill="#fbfaf7"/><circle cx="38" cy="38" r="4.2" fill="#fbfaf7"/>
        </g>
        <circle cx="24" cy="27" r="4.2" fill="#E8443A"/>
      </svg>
      <span>Maths<span class="map">Map</span></span>
    </div>
    <h1>See how every NSW maths skill connects.</h1>
    <p class="sub">Theory, worked examples, practice and quizzes for Stages&nbsp;3–6, one skill at a&nbsp;time.</p>
    <div class="chips">
      <span class="chip" style="background:var(--blue)">Number</span>
      <span class="chip" style="background:var(--orange)">Algebra</span>
      <span class="chip" style="background:var(--green)">Measurement</span>
      <span class="chip" style="background:var(--purple)">Statistics</span>
    </div>
  </div>
  <div class="url">mathsmap.mrdingmaths.com</div>

  <!-- Prerequisite-graph motif: skills (nodes) linked to the skills they unlock. -->
  <svg class="graph" width="520" height="630" viewBox="0 0 520 630" fill="none" aria-hidden="true">
    <g stroke="#cfd5dd" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="520" x2="220" y2="420"/><line x1="260" y1="545" x2="220" y2="420"/>
      <line x1="390" y1="510" x2="330" y2="400"/><line x1="220" y1="420" x2="270" y2="300"/>
      <line x1="330" y1="400" x2="270" y2="300"/><line x1="330" y1="400" x2="420" y2="300"/>
      <line x1="270" y1="300" x2="200" y2="185"/><line x1="270" y1="300" x2="340" y2="180"/>
      <line x1="420" y1="300" x2="340" y2="180"/><line x1="420" y1="300" x2="470" y2="190"/>
      <line x1="200" y1="185" x2="290" y2="75"/><line x1="340" y1="180" x2="290" y2="75"/>
      <line x1="470" y1="190" x2="420" y2="70"/><line x1="340" y1="180" x2="420" y2="70"/>
      <line x1="150" y1="300" x2="200" y2="185"/><line x1="220" y1="420" x2="150" y2="300"/>
    </g>
    <g stroke-width="5">
      <circle cx="120" cy="520" r="17" fill="#fff" stroke="#268cff"/>
      <circle cx="260" cy="545" r="17" fill="#fff" stroke="#4f9b63"/>
      <circle cx="390" cy="510" r="17" fill="#fff" stroke="#ef8b2c"/>
      <circle cx="220" cy="420" r="20" fill="#268cff" stroke="#268cff"/>
      <circle cx="330" cy="400" r="20" fill="#ef8b2c" stroke="#ef8b2c"/>
      <circle cx="150" cy="300" r="17" fill="#fff" stroke="#8b5cc7"/>
      <circle cx="270" cy="300" r="24" fill="#E8443A" stroke="#E8443A"/>
      <circle cx="420" cy="300" r="20" fill="#4f9b63" stroke="#4f9b63"/>
      <circle cx="200" cy="185" r="18" fill="#fff" stroke="#8b5cc7"/>
      <circle cx="340" cy="180" r="20" fill="#fff" stroke="#268cff"/>
      <circle cx="470" cy="190" r="17" fill="#fff" stroke="#ef8b2c"/>
      <circle cx="290" cy="75" r="17" fill="#fff" stroke="#52769a"/>
      <circle cx="420" cy="70" r="17" fill="#fff" stroke="#4f9b63"/>
    </g>
    <g fill="#fff"><circle cx="270" cy="300" r="8"/></g>
  </svg>
</body>
</html>
