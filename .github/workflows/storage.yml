name: Repository storage
on: [push, pull_request]
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/check-repo-storage.mjs
      - run: node --test tests/booklet-storage.test.js tests/repo-storage.test.js
